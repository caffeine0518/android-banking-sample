# main 에 머지되면 README의 모듈 의존성 트리를 다시 생성하고, 달라졌으면 커밋한다.
name: module-graph

on:
  push:
    branches: [main]
    paths:
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'build-logic/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew updateModuleGraph
      # GITHUB_TOKEN 으로 푸시한 커밋은 워크플로를 다시 트리거하지 않으므로 반복 실행되지 않는다
      - name: 변경분 커밋
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs(readme): 모듈 의존성 트리를 갱신한다"
          git push
